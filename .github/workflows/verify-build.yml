name: Verify Hiora Cloudflare build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.19.1
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Cloudflare Worker and public site
        run: npm run build
